[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "gitguru"
version = "0.1.0"
description = "A safe Git assistant that helps developers understand Git commands and recover from repository mistakes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "pydantic-settings",
    "pypdf>=7.1.1",
    "sqlalchemy[asyncio]>=2.1.9",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pre-commit",
    "poethepoet>=0.49.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.coverage.run]
source = ["gitguru"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.poe.tasks]
dev = "uvicorn gitguru.api.main:create_app --factory --reload --no-access-log"
lint = ["_ruff_check", "_ruff_format"]
_ruff_check = "ruff check ."
_ruff_format = "ruff format --check ."
test = "pytest tests/unit"
cov = "pytest --cov --cov-report=term-missing"
migrate = "alembic upgrade head"
seed = "python scripts/load_db.py"

[tool.poe.tasks.test-integration]
help = "Integration tests against the Postgres from docker compose (run `make up` first)"
cmd = "pytest tests/integration"

[tool.poe.tasks.test-integration.env.TEST_DATABASE_URL]
default = "postgresql://app:app@localhost:5433/app_test"
